server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The bundle is fingerprinted: a new build has new names, so a name is
    # never reused for different bytes and can be cached for good. Cache-Control
    # is written out rather than left to `expires`, which adds a second
    # Cache-Control header of its own beside it.
    #
    # No try_files here, on purpose. A name that is not in the image is a 404,
    # not index.html: a browser holding an older index.html asks for chunks
    # this image no longer has, and being answered with HTML (200) makes the
    # import fail with an error that says nothing about what happened. A 404
    # says it, and the interface reloads on it (src/lib/staleBundle.ts).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is what names the current bundle, so it must be revalidated
    # on every load. Without a header a browser may reuse it by heuristic,
    # and after an upgrade keeps running the old interface -- which is how a
    # reader came to see the pages of one release failing to load their chunks
    # from the next. `no-cache` still allows a 304; it only forbids reusing
    # the copy unasked.
    #
    # `location =` also catches the internal redirects below: `/` through
    # `index`, and the fallback for a client route through `try_files`.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # config.json is the one file that changes without the image changing.
    # Caching it would mean a board added to the chart's values did not appear
    # until somebody's browser gave up on a stale copy.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # A single-page application: every path that is not a file is the app.
    # (/assets/ is not covered by this; see above.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # This server holds nothing and proxies nothing. Saying so.
    server_tokens off;
}
