server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The bundle is fingerprinted, so it can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # config.json is the one file that changes without the image changing.
    # Caching it would mean a board added to the chart's values did not appear
    # until somebody's browser gave up on a stale copy.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # A single-page application: every path that is not a file is the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # This server holds nothing and proxies nothing. Saying so.
    server_tokens off;
}
