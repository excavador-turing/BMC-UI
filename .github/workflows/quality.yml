name: Quality

# Pull requests AND pushes to `hive`.
#
# It was pull_request only, inherited from upstream, and this fork pushes
# straight to `hive` -- so lint, build and tests had not run in CI here at all.
# `Tag and Build` looks like a safety net and is not: it is fenced to
# `github.repository == 'turing-machines/BMC-UI'` and triggers on `main`. Only
# `Release` ran, on tags, and by then the release is already public.
on:
  pull_request:
  push:
    branches: [hive]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # The demo's fixtures come from a real board, so a careless re-capture could
  # commit that board's address, MAC, hostname or serial. The guard runs
  # against what is committed, needs no board and no network, and is the only
  # thing standing between a capture and a public site.
  fixtures:
    name: no board identifiers in the demo fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check
        run: ./scripts/capture-fixtures.sh --check

  lint:
    name: Linting rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Linting rules
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  # How tall every tab is, measured rather than guessed.
  #
  # The site has had a screen gate since its rework and the interface had
  # none, which is how Settings reached four screens and the firmware-sources
  # editor came to be rendered on two tabs for a release with nobody noticing.
  #
  # Against the DEMO build, so no board is involved: the captured fixtures
  # answer, and a card whose endpoint they lack hides itself exactly as it
  # does on an older board. The script says in its own docstring which cards
  # that leaves uncounted.
  screens:
    name: No tab longer than two screens
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          npm ci
          pip install websockets

      # ubuntu-latest ships Chrome. The script starts it and kills it in the
      # same block, whatever happens.
      - name: Measure
        run: npm run screens

  # Every text box accepts typing.
  #
  # A controlled React input given `value` and no `onChange` is READ-ONLY:
  # React reverts each keystroke, silently, and the markup looks perfect.
  # The shared Input dropped `onChange` for `type="password"`, so all three
  # boxes of the password form -- and the factory-password page a board
  # shows before it will do anything else -- could not be typed into, from
  # the Tailwind move until BMC-Firmware#48 was reported by a user.
  #
  # Nothing else could see it: it builds, it lints, it renders, and the
  # screens gate measures height. So this types into every visible box of
  # the demo build and reads the value back.
  typing:
    name: Every text box accepts typing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          npm ci
          pip install websockets

      - name: Type into every box
        run: npm run type-test

  api-types:
    name: Generated API types match the pinned release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      # Regenerate from the bmcd release named in bmcd-release.txt and require
      # the result to be byte-identical to what is committed.
      #
      # This catches the two ways the interface and the daemon drift apart: a
      # hand edit to a generated file, and a pin moved without regenerating.
      # Neither would fail `tsc` -- the types would simply describe an API the
      # board no longer serves, which is the failure this whole line of work
      # exists to prevent.
      - name: Regenerate and compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          npm run api:refresh
          if ! git diff --exit-code -- src/lib/api/schema.d.ts; then
            echo "::error::src/lib/api/schema.d.ts is not what bmcd $(cat bmcd-release.txt) publishes. Run 'npm run api:refresh' and commit the result."
            exit 1
          fi
          echo "generated types match bmcd $(cat bmcd-release.txt)"
