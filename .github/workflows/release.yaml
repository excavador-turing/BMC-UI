name: Release

# A pushed tag is the only thing that publishes here.
#
# Upstream's tag-and-build.yml does the opposite: it tags from the version
# in package.json on every push to main and releases whatever it tagged.
# That suits a project whose output is a website. It does not suit this one,
# because the tarball is an input to a firmware build that pins it by
# sha256 -- so cutting a release has to be a decision somebody made, not a
# side effect of a merge.
on:
  push:
    tags: ["v*"]

# Never cancel a release in flight: the tag is already public by the time
# this starts.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release steps; nothing else here writes

    # Actions are pinned by commit, with the moving tag in the comment: a
    # retagged action cannot change what runs in a job that can publish
    # releases.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain comes from devbox.json rather than from whatever node
      # the runner image happens to ship, so the bytes a firmware build pins
      # by sha256 were produced by the same node a developer has locally.
      - name: install devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          devbox-version: 0.18.0
          enable-cache: "true"

      - name: toolchain
        run: devbox run -- 'node --version; npm --version'

      - name: install dependencies
        run: devbox run -- npm ci

      - name: build
        # Explicit, not inherited: `devbox run` does not promise to pass the
        # workflow environment through, and a silently-absent version would
        # fall back to package.json -- which is upstream's, and would make
        # every release claim to be upstream v3.3.7 again.
        env:
          BMC_UI_VERSION: ${{ github.ref_name }}
        run: devbox run -- npm run build

      # The asset keeps upstream's name -- bmc-ui-<tag>.tar.gz wrapping a
      # top-level dist/ -- so Buildroot's generic-package finds it under the
      # default source filename it derives from the package name and
      # version, and our bmc-ui.mk needs nothing changed but BMC_UI_SITE and
      # BMC_UI_VERSION.
      #
      # LICENSE goes INSIDE dist/. Buildroot extracts with
      # --strip-components=1, so dist/ becomes the package source directory
      # and BMC_UI_LICENSE_FILES = LICENSE -- which our .mk has always
      # declared -- finally resolves against a file that exists. Upstream's
      # tarball omits it: for a GPL-2.0 work redistributed on a device, that
      # is a gap worth closing rather than inheriting. It also lands in
      # /srv/bmcd/www/, so the licence is served next to the UI it covers.
      #
      # The archive is built with fixed ownership, sorted names and the tag
      # commit's timestamp, and gzipped with -n, so re-running the same tag
      # does not produce a different sha256 purely because of when it ran.
      - name: stage the tarball
        run: |
          set -eu
          cp LICENSE dist/LICENSE
          mkdir -p artifacts
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tar --sort=name \
              --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              -cf - dist \
            | gzip -9 -n > "artifacts/bmc-ui-${GITHUB_REF_NAME}.tar.gz"
          tar -tzf "artifacts/bmc-ui-${GITHUB_REF_NAME}.tar.gz" | head -5

      # SHA256SUMS lists BARE BASENAMES, and the guard below fails the
      # release if one ever does not.
      #
      # This is the trap that cost the firmware repo a day. `sha256sum -c`
      # resolves each name relative to the current directory, so a line
      # carrying a path -- an absolute build-machine path, or even
      # "artifacts/..." -- makes it fail to OPEN the file on the machine
      # doing the verifying. That is a different failure from a mismatch,
      # and the "No such file or directory" it prints is easy for a build
      # script to step over as though the check had passed. Generating from
      # inside the directory is what keeps the names bare.
      - name: checksums
        run: |
          set -eu
          cd artifacts
          sha256sum -- *.tar.gz > SHA256SUMS
          if grep -q '/' SHA256SUMS; then
            echo "SHA256SUMS contains a path; it must list basenames only" >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: archive artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: bmc-ui-${{ github.ref_name }}
          path: artifacts/*

      # draft: true, then publish in a separate step. With immutable
      # releases enabled, assets are locked the moment a release is
      # published, and this action publishes a prerelease BEFORE uploading
      # to it. A draft accepts assets; `gh release edit --draft=false` then
      # makes the whole set visible at once, which is also what a downloader
      # wants. A tag with a "-" in it is a prerelease and never "Latest".
      - name: release (draft, with assets)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            BMC-UI built from the `hive` branch of this fork, for the
            Turing Pi 2 BMC firmware build to consume.

            **Not a Turing Pi release.** `bmc-ui-${{ github.ref_name }}.tar.gz`
            unpacks to `dist/`, which is what lands in `/srv/bmcd/www/`.

            Verify with:

            ```
            sha256sum -c SHA256SUMS
            ```

            SHA256SUMS lists bare filenames, so run it from the directory
            holding the tarball.

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false

      # The site at turingpi.xyz builds its live demo from the LATEST release
      # of this repository, so a release here is what makes the site stale.
      # It is NOT told from here.
      #
      # Telling it would mean a cross-repository write credential living in
      # this repository's secrets -- a token that can push to the site, held
      # by a workflow that has no other reason to touch it, for the sake of
      # saving up to an hour on a demo page. The site polls instead: it
      # compares this repository's releases/latest with the tag it already
      # serves and rebuilds only when they differ. No credential exists to
      # leak, expire, or be scoped wrongly.
      #
      # For an immediate rebuild after a release:
      #   gh workflow run pages.yml --repo excavador-turing/www

  # ---------------------------------------------------------------------
  # The fleet interface: one image and one chart, both to GHCR.
  #
  # Separate jobs from the tarball above because they ship a different thing
  # to a different consumer. The tarball is what the FIRMWARE unpacks into a
  # board's web root; these two are what the CLUSTER runs. A tag moves both,
  # which is the point -- the fleet is built from the same tree as the board
  # interface and shares its components by import, so they cannot drift.
  # ---------------------------------------------------------------------
  fleet-image:
    name: Fleet image
    # A NATIVE arm64 runner. Every control-plane node in the estate is arm64
    # (two RK1s and a Pi 5), and the chart pins this pod to the control plane,
    # so an amd64-only image would be unschedulable where it is meant to run.
    # Native beats emulation here: the build runs npm ci and a Vite build,
    # which under qemu takes minutes rather than seconds.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.fleet
          platforms: linux/arm64
          push: true
          # The tag and `latest`. `latest` is a convenience for a human
          # pulling it by hand; the chart pins the exact tag, because a
          # deployment that follows `latest` changes when nobody asked it to.
          tags: |
            ghcr.io/excavador-turing/turing-fleet:${{ github.ref_name }}
            ghcr.io/excavador-turing/turing-fleet:latest
          build-args: |
            BMC_UI_VERSION=${{ github.ref_name }}
          provenance: false

      - name: say what was pushed
        run: |
          echo "ghcr.io/excavador-turing/turing-fleet:${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"

  fleet-chart:
    name: Fleet chart
    needs: fleet-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: package and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # The tag is the single source of both numbers. Chart.yaml's own
          # values exist only so a local `helm template` works; publishing
          # from them would let the chart and the image it points at drift.
          version="${GITHUB_REF_NAME#v}"
          helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin <<< "${GH_TOKEN}"
          helm package charts/turing-fleet \
            --version "${version}" --app-version "${GITHUB_REF_NAME}"
          helm push "turing-fleet-${version}.tgz" oci://ghcr.io/excavador-turing/charts
          echo "oci://ghcr.io/excavador-turing/charts/turing-fleet:${version}" >> "$GITHUB_STEP_SUMMARY"

